<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nguyễn Tiến An Huy - Dịch Vụ Website</title>
    <!-- Three.js cho hiệu ứng background 3D chuyển động -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --gold-yellow: #ffd700;
            --gold-glow: rgba(255, 215, 0, 0.6);
            --bg-dark: #050b14;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-dark);
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
            padding: 20px 0;
        }

        /* Canvas Background 3D Chuyển Động */
        #bg-3d-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            pointer-events: none;
        }

        .container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 460px;
            padding: 15px;
        }

        /* Ô hình vuông bình thường có Viền Trắng */
        .normal-square-card {
            position: relative;
            background: rgba(12, 20, 36, 0.85);
            border: 2px solid #ffffff; /* Viền màu trắng */
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(255, 255, 255, 0.15);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            text-decoration: none;
            color: #fff;
            overflow: hidden;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .normal-square-card:active,
        .normal-square-card:hover {
            transform: translateY(-4px);
            border-color: #ffffff;
            box-shadow: 0 12px 30px rgba(255, 255, 255, 0.3);
        }

        .card-content {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 25px 20px;
        }

        /* Profile Header */
        .profile-card {
            display: block;
            margin-bottom: 22px;
            cursor: pointer;
        }

        .owner-badge {
            font-size: 26px;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: 3px;
            text-transform: uppercase;
            padding: 8px 26px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid #ffffff; /* Viền trắng */
            margin-bottom: 15px;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
            text-shadow: 0 0 8px #ffffff;
        }

        .name-title {
            color: var(--gold-yellow);
            font-size: 21px;
            font-weight: 900;
            margin-bottom: 12px;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.6);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .zalo-phone {
            color: #0084ff;
            background: #ffffff;
            padding: 8px 20px;
            border-radius: 25px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-weight: 800;
            font-size: 15px;
            box-shadow: 0 0 15px rgba(0, 132, 255, 0.4);
        }

        /* Services Grid */
        .services-grid {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .square-card {
            aspect-ratio: 1 / 1; /* Hình vuông */
        }

        .card-icon {
            font-size: 42px;
            color: #ffffff;
            margin-bottom: 15px;
            text-shadow: 0 0 12px rgba(255, 255, 255, 0.6);
        }

        .card-desc {
            font-size: 15px;
            font-weight: 700;
            line-height: 1.5;
            color: #ffffff;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        /* GIÁ TIỀN MÀU VÀNG */
        .card-price {
            background: linear-gradient(135deg, #ffd700, #ffaa00);
            color: #000000;
            font-size: 20px;
            font-weight: 900;
            padding: 10px 24px;
            border-radius: 12px;
            box-shadow: 0 0 20px var(--gold-glow);
            letter-spacing: 0.5px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .card-price i {
            font-size: 22px;
            color: #000000;
        }
    </style>
</head>
<body>

    <!-- Canvas Background 3D Chuyển Động -->
    <canvas id="bg-3d-canvas"></canvas>

    <div class="container">
        
        <!-- ĐẦU TRANG: CHỮ OWNER & ZALO -->
        <a href="https://zalo.me/0975787858" target="_blank" class="normal-square-card profile-card">
            <div class="card-content">
                <div class="owner-badge">OWNER</div>
                <div class="name-title">Nguyễn Tiến An Huy</div>
                <div class="zalo-phone">
                    <i class="fa-solid fa-comment-dots"></i> Zalo: 0975787858
                </div>
            </div>
        </a>

        <!-- CÁC Ô HÌNH VUÔNG DỊCH VỤ (VIỀN TRẮNG, GIÁ VÀNG) -->
        <div class="services-grid">
            
            <!-- GÓI 1: 20K -->
            <div class="normal-square-card square-card">
                <div class="card-content">
                    <div class="card-icon"><i class="fa-solid fa-id-card"></i></div>
                    <div class="card-desc">LÀM LINK VỀ GIỚI THIỆU TRANG CÁ NHÂN, MÃ QR NGÂN HÀNG</div>
                    <div class="card-price">
                        <i class="fa-solid fa-coins"></i> GIÁ 20K
                    </div>
                </div>
            </div>

            <!-- GÓI 2: 30K -->
            <div class="normal-square-card square-card">
                <div class="card-content">
                    <div class="card-icon"><i class="fa-solid fa-store"></i></div>
                    <div class="card-desc">LÀM LINK VỀ BÁN HÀNG, BUÔN BÁN, MÃ QR</div>
                    <div class="card-price">
                        <i class="fa-solid fa-coins"></i> GIÁ 30K
                    </div>
                </div>
            </div>

            <!-- GÓI 3: 50K UNLIMITED -->
            <div class="normal-square-card square-card">
                <div class="card-content">
                    <div class="card-icon"><i class="fa-solid fa-infinity"></i></div>
                    <div class="card-desc">LÀM LINK VỀ THEO Ý NGƯỜI MUỐN, KHÔNG GIỚI HẠN</div>
                    <div class="card-price">
                        <i class="fa-solid fa-coins"></i> GIÁ 50K
                    </div>
                </div>
            </div>

        </div>

    </div>

    <script>
        // Hiệu ứng Nền Background 3D Chuyển Động Xoay Không Gian
        const canvas = document.getElementById('bg-3d-canvas');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });

        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        // Khởi tạo các vòng hạt 3D xoay trong không gian
        const geometry = new THREE.BufferGeometry();
        const count = 350;
        const positions = new Float32Array(count * 3);
        const colors = new Float32Array(count * 3);

        for (let i = 0; i < count * 3; i += 3) {
            positions[i] = (Math.random() - 0.5) * 12;
            positions[i + 1] = (Math.random() - 0.5) * 12;
            positions[i + 2] = (Math.random() - 0.5) * 12;

            // Màu xanh & trắng cho hạt 3D
            colors[i] = 0.2 + Math.random() * 0.8;
            colors[i + 1] = 0.6 + Math.random() * 0.4;
            colors[i + 2] = 1.0;
        }

        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

        const material = new THREE.PointsMaterial({
            size: 0.06,
            vertexColors: true,
            transparent: true,
            opacity: 0.7
        });

        const points = new THREE.Points(geometry, material);
        scene.add(points);

        camera.position.z = 5;

        // Vòng lặp hoạt họa 3D xoay mượt
        function animate() {
            requestAnimationFrame(animate);

            points.rotation.x += 0.0012;
            points.rotation.y += 0.0018;

            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
