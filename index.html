<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KAZI AIMLOCK IOS VIETNAM</title>
    <!-- Three.js Library for 3D Snow Effect -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #00d2ff;
            --primary-glow: rgba(0, 210, 255, 0.4);
            --bg-dark: #030a16;
            --card-bg: rgba(10, 25, 47, 0.75);
            --text-light: #e6f1ff;
            --danger: #ff0055;
            --success: #00ff66;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Rajdhani', sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        #snow-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            pointer-events: none;
        }

        .container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 450px;
            padding: 20px;
            margin: 20px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid rgba(0, 210, 255, 0.3);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 0 30px var(--primary-glow);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            text-align: center;
            transition: all 0.3s ease;
        }

        .title {
            font-family: 'Orbitron', sans-serif;
            font-size: 22px;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 0 10px var(--primary);
            margin-bottom: 20px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .subtitle {
            font-size: 14px;
            color: #8892b0;
            margin-bottom: 20px;
        }

        /* Lock Screen */
        .input-group {
            position: relative;
            margin-bottom: 20px;
        }

        .input-field {
            width: 100%;
            padding: 14px 15px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(0, 210, 255, 0.4);
            border-radius: 10px;
            color: #fff;
            font-size: 16px;
            outline: none;
            transition: 0.3s;
            text-align: center;
            letter-spacing: 1px;
        }

        .input-field:focus {
            border-color: var(--primary);
            box-shadow: 0 0 15px var(--primary-glow);
        }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #00d2ff, #0066ff);
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 0 20px var(--primary-glow);
            transition: 0.3s;
            text-transform: uppercase;
            font-family: 'Orbitron', sans-serif;
        }

        .btn:active {
            transform: scale(0.98);
        }

        /* Main Dashboard */
        #main-app {
            display: none;
        }

        .timer-box {
            background: rgba(0, 210, 255, 0.1);
            border: 1px dashed var(--primary);
            border-radius: 10px;
            padding: 10px;
            margin-bottom: 20px;
            font-size: 14px;
            color: #00ffea;
            font-weight: bold;
        }

        .feature-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 15px;
            background: rgba(255, 255, 255, 0.05);
            margin-bottom: 12px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .feature-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 16px;
            font-weight: 600;
        }

        .feature-title i {
            color: var(--primary);
        }

        /* Toggle Switch */
        .switch {
            position: relative;
            display: inline-block;
            width: 46px;
            height: 24px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #2a3b5c;
            transition: .4s;
            border-radius: 24px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: var(--primary);
            box-shadow: 0 0 10px var(--primary);
        }

        input:checked + .slider:before {
            transform: translateX(22px);
        }

        /* Account Check Section */
        .acc-check-box {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            padding: 15px;
            margin-top: 20px;
            border: 1px solid rgba(0, 210, 255, 0.2);
            text-align: left;
        }

        .acc-check-title {
            font-size: 16px;
            font-weight: bold;
            color: var(--primary);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .acc-info-result {
            display: none;
            background: rgba(0, 255, 102, 0.1);
            border: 1px solid var(--success);
            padding: 12px;
            border-radius: 8px;
            margin-top: 10px;
            font-size: 14px;
            word-break: break-all;
        }

        /* Free Fire Launchers */
        .ff-launch-title {
            margin-top: 25px;
            margin-bottom: 15px;
            font-size: 16px;
            font-weight: bold;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .ff-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .btn-ff {
            padding: 12px;
            border-radius: 10px;
            border: none;
            background: linear-gradient(135deg, #ff8c00, #e52d27);
            color: white;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 0 15px rgba(229, 45, 39, 0.4);
            text-decoration: none;
            font-size: 14px;
        }

        .btn-ff-max {
            background: linear-gradient(135deg, #8e2de2, #4a00e0);
            box-shadow: 0 0 15px rgba(142, 45, 226, 0.4);
        }

        /* Notification Toast */
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: var(--card-bg);
            border: 1px solid var(--primary);
            color: #fff;
            padding: 12px 25px;
            border-radius: 30px;
            box-shadow: 0 0 20px var(--primary-glow);
            z-index: 1000;
            transition: 0.5s ease;
            font-size: 14px;
            text-align: center;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
        }

        /* Crosshair Overlay */
        #crosshair {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 20px;
            height: 20px;
            border: 2px solid #00ff66;
            border-radius: 50%;
            pointer-events: none;
            z-index: 9999;
            box-shadow: 0 0 10px #00ff66;
        }

        #crosshair::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 4px;
            height: 4px;
            background: #00ff66;
            border-radius: 50%;
        }
    </style>
</head>
<body>

    <!-- 3D Snow Canvas -->
    <canvas id="snow-canvas"></canvas>

    <!-- Virtual Crosshair -->
    <div id="crosshair"></div>

    <!-- Notification Toast -->
    <div id="toast" class="toast">Thông báo</div>

    <div class="container">
        
        <!-- LOGIN KEY SCREEN -->
        <div id="login-card" class="card">
            <div class="title"><i class="fa-solid fa-shield-halved"></i> KAZI AIMLOCK</div>
            <div class="subtitle">HỆ THỐNG IOS VIỆT NAM</div>
            
            <div class="input-group">
                <input type="text" id="key-input" class="input-field" placeholder="Nhập Key kích hoạt..." autocomplete="off">
            </div>

            <button class="btn" onclick="verifyKey()">Kích Hoạt Menu</button>
        </div>

        <!-- MAIN MENU APP -->
        <div id="main-app" class="card">
            <div class="title">KAZI AIMLOCK</div>

            <div class="timer-box">
                <i class="fa-solid fa-clock"></i> Hạn Dùng Key: <span id="timer">24:00:00</span>
            </div>

            <!-- Toggles -->
            <div class="feature-item">
                <div class="feature-title"><i class="fa-solid fa-crosshairs"></i> Bật Aim Lock</div>
                <label class="switch">
                    <input type="checkbox" onchange="toggleFeature('Aim Lock', this.checked)">
                    <span class="slider"></span>
                </label>
            </div>

            <div class="feature-item">
                <div class="feature-title"><i class="fa-solid fa-feather"></i> Nhẹ Tâm</div>
                <label class="switch">
                    <input type="checkbox" onchange="toggleFeature('Nhẹ Tâm', this.checked)">
                    <span class="slider"></span>
                </label>
            </div>

            <div class="feature-item">
                <div class="feature-title"><i class="fa-solid fa-bullseye"></i> Tâm Ảo</div>
                <label class="switch">
                    <input type="checkbox" id="crosshair-toggle" onchange="toggleCrosshair(this.checked)">
                    <span class="slider"></span>
                </label>
            </div>

            <div class="feature-item">
                <div class="feature-title"><i class="fa-solid fa-bolt"></i> Fix Lag iOS</div>
                <label class="switch">
                    <input type="checkbox" onchange="toggleFeature('Fix Lag', this.checked)">
                    <span class="slider"></span>
                </label>
            </div>

            <!-- Account Check Section -->
            <div class="acc-check-box">
                <div class="acc-check-title"><i class="fa-solid fa-user-lock"></i> Check MK Acc</div>
                
                <div class="input-group" style="margin-bottom: 10px;">
                    <input type="text" id="acc-name" class="input-field" placeholder="Nhập tên mã Acc..." style="font-size: 14px; padding: 10px;">
                </div>

                <div id="key-acc-group" class="input-group" style="margin-bottom: 10px; display: none;">
                    <input type="text" id="acc-key" class="input-field" placeholder="Nhập Key xác nhận..." style="font-size: 14px; padding: 10px;">
                </div>

                <button class="btn" style="padding: 10px; font-size: 14px;" onclick="checkAccount()">Kiểm Tra Acc</button>

                <div id="acc-result" class="acc-info-result">
                    <div style="font-weight: bold; color: #00ff66; margin-bottom: 5px;">Đăng nhập X:</div>
                    <div><b>TK:</b> <span id="res-user"></span></div>
                    <div><b>MK:</b> <span id="res-pass"></span></div>
                </div>
            </div>

            <!-- Open Free Fire Section -->
            <div class="ff-launch-title"><i class="fa-solid fa-gamepad"></i> Mở Game Free Fire</div>
            <div class="ff-buttons">
                <a href="https://apps.apple.com/vn/app/free-fire/id1300865805" target="_blank" class="btn-ff">
                    <i class="fa-solid fa-fire"></i> FF Thường
                </a>
                <a href="https://apps.apple.com/vn/app/free-fire-max/id1480516829" target="_blank" class="btn-ff btn-ff-max">
                    <i class="fa-solid fa-fire-flame-curved"></i> FF MAX
                </a>
            </div>

        </div>

    </div>

    <script>
        // Key Configurations
        const MAIN_KEY = "KAZI-NKPE-ZQP-2097";
        const ACC_TARGET = "áo_f168";
        const ACC_KEY = "367";
        const ACCOUNT_DATA = {
            user: "accclone2097",
            pass: "accclone2026"
        };

        // Notification System
        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        // Verify Key Main Login
        function verifyKey() {
            const inputKey = document.getElementById('key-input').value.trim();

            if (inputKey === MAIN_KEY) {
                // Save login time
                let startTime = localStorage.getItem('kazi_key_time');
                if (!startTime) {
                    startTime = new Date().getTime();
                    localStorage.setItem('kazi_key_time', startTime);
                }

                showToast("Kích hoạt thành công! 24 giờ sử dụng key.");
                document.getElementById('login-card').style.display = 'none';
                document.getElementById('main-app').style.display = 'block';
                startTimer();
            } else {
                showToast("Mã Key không chính xác hoặc đã hết hạn!");
            }
        }

        // Timer System (24 hours)
        function startTimer() {
            const timerElement = document.getElementById('timer');
            const duration = 24 * 60 * 60 * 1000; // 24 hours in ms

            setInterval(() => {
                const startTime = parseInt(localStorage.getItem('kazi_key_time') || new Date().getTime());
                const now = new Date().getTime();
                const remaining = duration - (now - startTime);

                if (remaining <= 0) {
                    localStorage.removeItem('kazi_key_time');
                    alert("Key của bạn đã hết hạn 24h sử dụng!");
                    location.reload();
                } else {
                    const hours = Math.floor((remaining % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                    const minutes = Math.floor((remaining % (1000 * 60 * 60)) / (1000 * 60));
                    const seconds = Math.floor((remaining % (1000 * 60)) / 1000);

                    timerElement.innerText = 
                        `${hours < 10 ? '0' : ''}${hours}:${minutes < 10 ? '0' : ''}${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
                }
            }, 1000);
        }

        // Feature Toggles
        function toggleFeature(name, state) {
            if (state) {
                showToast(`Đã BẬT tính năng ${name}`);
            } else {
                showToast(`Đã TẮT tính năng ${name}`);
            }
        }

        function toggleCrosshair(state) {
            const crosshair = document.getElementById('crosshair');
            if (state) {
                crosshair.style.display = 'block';
                showToast("Đã BẬT Tâm Ảo");
            } else {
                crosshair.style.display = 'none';
                showToast("Đã TẮT Tâm Ảo");
            }
        }

        // Check Account Security System
        let isAccCodeValid = false;

        function checkAccount() {
            const accNameInput = document.getElementById('acc-name').value.trim();
            const accKeyGroup = document.getElementById('key-acc-group');
            const accKeyInput = document.getElementById('acc-key').value.trim();
            const accResult = document.getElementById('acc-result');

            if (!isAccCodeValid) {
                if (accNameInput === ACC_TARGET) {
                    isAccCodeValid = true;
                    accKeyGroup.style.display = 'block';
                    showToast("Đã tìm thấy mã Acc! Nhập Key xác minh để mở.");
                } else {
                    showToast("Không có acc tồn tại trên hệ thống KAZI");
                    accKeyGroup.style.display = 'none';
                    accResult.style.display = 'none';
                }
            } else {
                if (accKeyInput === ACC_KEY) {
                    document.getElementById('res-user').innerText = ACCOUNT_DATA.user;
                    document.getElementById('res-pass').innerText = ACCOUNT_DATA.pass;
                    accResult.style.display = 'block';
                    showToast("Mở khóa thông tin tài khoản thành công!");
                } else {
                    showToast("Key xác minh không đúng!");
                    accResult.style.display = 'none';
                }
            }
        }

        // Auto Check session on page load
        window.onload = function() {
            const startTime = localStorage.getItem('kazi_key_time');
            if (startTime) {
                const now = new Date().getTime();
                if (now - parseInt(startTime) < 24 * 60 * 60 * 1000) {
                    document.getElementById('login-card').style.display = 'none';
                    document.getElementById('main-app').style.display = 'block';
                    startTimer();
                } else {
                    localStorage.removeItem('kazi_key_time');
                }
            }
        };

        // Three.js 3D Snow Particle Effect
        const canvas = document.getElementById('snow-canvas');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true });

        renderer.setSize(window.innerWidth, window.innerHeight);
        camera.position.z = 5;

        // Create Particles
        const particleCount = 600;
        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(particleCount * 3);

        for (let i = 0; i < particleCount * 3; i += 3) {
            positions[i] = (Math.random() - 0.5) * 10;
            positions[i + 1] = (Math.random() - 0.5) * 10;
            positions[i + 2] = (Math.random() - 0.5) * 10;
        }

        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

        const material = new THREE.PointsMaterial({
            color: 0x00d2ff,
            size: 0.03,
            transparent: true,
            opacity: 0.8
        });

        const particles = new THREE.Points(geometry, material);
        scene.add(particles);

        // Animation Loop
        function animate() {
            requestAnimationFrame(animate);

            const posArray = geometry.attributes.position.array;
            for (let i = 1; i < particleCount * 3; i += 3) {
                posArray[i] -= 0.01;
                if (posArray[i] < -5) {
                    posArray[i] = 5;
                }
            }
            geometry.attributes.position.needsUpdate = true;

            particles.rotation.y += 0.001;
            renderer.render(scene, camera);
        }

        animate();

        // Responsive Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
