<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nguyễn Tiến An Huy - Dịch Vụ Website</title>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-blue: #00d2ff;
            --blue-glow: rgba(0, 210, 255, 0.4);
            --bg-dark: #030a16;
            --gold-yellow: #ffd700;
            --neon-green: #2ecc71;
            --green-glow: rgba(46, 204, 113, 0.6);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-dark);
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
            padding: 20px 0;
        }

        /* Canvas Tuyết rơi siêu nhẹ */
        #snow-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 480px;
            padding: 15px;
        }

        /* Nền Trong Suốt Liquid Glass */
        .liquid-glass-card {
            position: relative;
            background: rgba(255, 255, 255, 0.06);
            border: 1.5px solid rgba(0, 210, 255, 0.4);
            border-top: 1.5px solid rgba(255, 255, 255, 0.4);
            border-left: 1.5px solid rgba(255, 255, 255, 0.3);
            border-radius: 24px;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37),
                        inset 0 0 15px rgba(255, 255, 255, 0.05);
            transition: all 0.3s ease;
            text-decoration: none;
            color: #fff;
            overflow: hidden;
        }

        .liquid-glass-card:active,
        .liquid-glass-card:hover {
            transform: translateY(-3px);
            border-color: var(--primary-blue);
            box-shadow: 0 12px 35px 0 rgba(0, 210, 255, 0.4);
        }

        .card-content {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 25px;
        }

        /* Profile Box */
        .profile-card {
            display: block;
            margin-bottom: 25px;
            cursor: pointer;
        }

        /* Badge OWNER */
        .owner-badge {
            font-size: 28px;
            font-weight: 900;
            color: #00f2fe;
            letter-spacing: 4px;
            text-transform: uppercase;
            padding: 8px 24px;
            border-radius: 16px;
            background: rgba(0, 242, 254, 0.1);
            border: 2px solid #00f2fe;
            margin-bottom: 15px;
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.5), inset 0 0 10px rgba(0, 242, 254, 0.3);
            text-shadow: 0 0 10px #00f2fe;
        }

        .name-title {
            color: var(--gold-yellow);
            font-size: 22px;
            font-weight: 900;
            margin-bottom: 12px;
            text-shadow: 0 0 12px rgba(255, 215, 0, 0.7);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .zalo-phone {
            color: #0084ff;
            background: #ffffff;
            padding: 8px 18px;
            border-radius: 25px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            font-size: 15px;
            box-shadow: 0 0 15px rgba(0, 132, 255, 0.5);
        }

        /* Square Service Cards */
        .services-grid {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .square-card {
            aspect-ratio: 1 / 1;
        }

        .card-icon {
            font-size: 42px;
            color: var(--primary-blue);
            margin-bottom: 15px;
            text-shadow: 0 0 15px var(--primary-blue);
        }

        .card-desc {
            font-size: 15px;
            font-weight: 700;
            line-height: 1.5;
            color: #ffffff;
            margin-bottom: 20px;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(0, 0, 0, 0.9);
        }

        /* Nút giá tiền XANH LÁ CÂY kèm Logo Tiền */
        .card-price {
            background: linear-gradient(135deg, #11998e, #38ef7d);
            color: #031507;
            font-size: 20px;
            font-weight: 900;
            padding: 10px 24px;
            border-radius: 14px;
            box-shadow: 0 0 20px var(--green-glow);
            letter-spacing: 1px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .card-price i {
            font-size: 22px;
        }
    </style>
</head>
<body>

    <!-- Canvas Tuyết Rơi 2D thuần không bị giật lag/đen màn hình -->
    <canvas id="snow-canvas"></canvas>

    <div class="container">
        
        <!-- ĐẦU TRANG: CHỮ OWNER & THÔNG TIN ZALO -->
        <a href="https://zalo.me/0975787858" target="_blank" class="liquid-glass-card profile-card">
            <div class="card-content">
                <div class="owner-badge">OWNER</div>
                <div class="name-title">Nguyễn Tiến An Huy</div>
                <div class="zalo-phone">
                    <i class="fa-solid fa-comment-dots"></i> Zalo: 0975787858
                </div>
            </div>
        </a>

        <!-- CÁC Ô HÌNH VUÔNG DỊCH VỤ -->
        <div class="services-grid">
            
            <!-- GÓI 1: 20K -->
            <div class="liquid-glass-card square-card">
                <div class="card-content">
                    <div class="card-icon"><i class="fa-solid fa-id-card"></i></div>
                    <div class="card-desc">LÀM LINK VỀ GIỚI THIỆU TRANG CÁ NHÂN, MÃ QR NGÂN HÀNG</div>
                    <div class="card-price">
                        <i class="fa-solid fa-money-bill-wave"></i> GIÁ 20K
                    </div>
                </div>
            </div>

            <!-- GÓI 2: 30K -->
            <div class="liquid-glass-card square-card">
                <div class="card-content">
                    <div class="card-icon"><i class="fa-solid fa-store"></i></div>
                    <div class="card-desc">LÀM LINK VỀ BÁN HÀNG, BUÔN BÁN, MÃ QR</div>
                    <div class="card-price">
                        <i class="fa-solid fa-money-bill-wave"></i> GIÁ 30K
                    </div>
                </div>
            </div>

            <!-- GÓI 3: 50K UNLIMITED -->
            <div class="liquid-glass-card square-card">
                <div class="card-content">
                    <div class="card-icon"><i class="fa-solid fa-infinity"></i></div>
                    <div class="card-desc">LÀM LINK VỀ THEO Ý NGƯỜI MUỐN, KHÔNG GIỚI HẠN</div>
                    <div class="card-price">
                        <i class="fa-solid fa-money-bill-wave"></i> GIÁ 50K
                    </div>
                </div>
            </div>

        </div>

    </div>

    <script>
        // Hiệu ứng tuyết rơi 2D Canvas thuần siêu nhẹ & tương thích 100% mọi trình duyệt
        const canvas = document.getElementById('snow-canvas');
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        const numFlakes = 70;
        const flakes = [];

        for (let i = 0; i < numFlakes; i++) {
            flakes.push({
                x: Math.random() * width,
                y: Math.random() * height,
                r: Math.random() * 2.5 + 1,
                d: Math.random() * 1 + 0.5,
                opacity: Math.random() * 0.7 + 0.3
            });
        }

        function drawFlakes() {
            ctx.clearRect(0, 0, width, height);
            ctx.fillStyle = "rgba(0, 210, 255, 0.8)";
            ctx.beginPath();
            for (let i = 0; i < numFlakes; i++) {
                const f = flakes[i];
                ctx.moveTo(f.x, f.y);
                ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2, true);
            }
            ctx.fill();
            moveFlakes();
        }

        function moveFlakes() {
            for (let i = 0; i < numFlakes; i++) {
                const f = flakes[i];
                f.y += f.d;
                f.x += Math.sin(f.y * 0.02) * 0.5;

                if (f.y > height) {
                    flakes[i] = { x: Math.random() * width, y: 0, r: f.r, d: f.d, opacity: f.opacity };
                }
            }
        }

        function animate() {
            drawFlakes();
            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
